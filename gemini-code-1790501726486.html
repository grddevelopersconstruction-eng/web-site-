<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Trigger Architecture Frame</title>
  
  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Pinning Container */
    .scroll-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Fixed Frame Panels (Architectural Overlay) */
    .hero-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      background-size: cover;
      background-position: center;
      transition: transform 0.1s ease-out;
    }

    /* 4-Corner Layout to form a Cross Viewport */
    .panel-top-left {
      top: 0;
      left: 0;
      width: 42vw;
      height: 40vh;
      background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1000&q=80');
    }

    .panel-top-right {
      top: 0;
      right: 0;
      width: 42vw;
      height: 40vh;
      background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1000&q=80');
    }

    .panel-bottom-left {
      bottom: 0;
      left: 0;
      width: 42vw;
      height: 40vh;
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=80');
    }

    .panel-bottom-right {
      bottom: 0;
      right: 0;
      width: 42vw;
      height: 40vh;
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=80');
    }

    /* Center Content Box Inside the Cross Frame */
    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 11;
      text-align: center;
      width: 16vw;
      padding: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }

    .center-box h1 {
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .center-box p {
      font-size: 0.8rem;
      color: #ccc;
    }

    /* Next Page Content (Revealed on Scroll) */
    .next-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 40px;
      text-align: center;
    }

    .next-page h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .next-page p {
      max-width: 600px;
      line-height: 1.6;
      color: #d1d5db;
    }

    .spacer {
      height: 150vh;
    }
  </style>
</head>
<body>

  <!-- Scroll Container -->
  <div class="scroll-container" id="pinned-section">
    
    <!-- Hero Frame (Building Walls) -->
    <div class="hero-frame">
      <div class="panel panel-top-left" id="panel-tl"></div>
      <div class="panel panel-top-right" id="panel-tr"></div>
      <div class="panel panel-bottom-left" id="panel-bl"></div>
      <div class="panel panel-bottom-right" id="panel-br"></div>
    </div>

    <!-- Inner Box Content -->
    <div class="center-box" id="hero-content">
      <h1>Perspective</h1>
      <p>Scroll down to reveal</p>
    </div>

    <!-- Next Page Content -->
    <div class="next-page" id="next-content">
      <h2>Welcome to the Next Page</h2>
      <p>
        As you scrolled down, the outer architectural frames parted sideways, smoothly transitioning you into this next section. Scrolling back up reverses the animation to seal the view back.
      </p>
    </div>

  </div>

  <div class="spacer"></div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Timeline for pinned scroll trigger
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#pinned-section",
        start: "top top",
        end: "+=150%",
        scrub: 1,
        pin: true,
        anticipatePin: 1
      }
    });

    // Animate Center Box Fade Out
    tl.to("#hero-content", {
      opacity: 0,
      scale: 0.8,
      duration: 0.5
    }, 0);

    // Animate Left/Right Building Panels Outward
    tl.to("#panel-tl", { xPercent: -100, yPercent: -100, duration: 1.5 }, 0.2)
      .to("#panel-tr", { xPercent: 100, yPercent: -100, duration: 1.5 }, 0.2)
      .to("#panel-bl", { xPercent: -100, yPercent: 100, duration: 1.5 }, 0.2)
      .to("#panel-br", { xPercent: 100, yPercent: 100, duration: 1.5 }, 0.2);

    // Fade in and scale next content smoothly
    tl.from("#next-content", {
      scale: 0.9,
      opacity: 0.5,
      duration: 1
    }, 0.3);
  </script>
</body>
</html>
